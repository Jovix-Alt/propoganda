<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Propoganda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;700&display=swap"
    rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Top Bar -->
        <div class="top-bar">

            <div class="theme-box">
                  <div class="theme-toggle" id="theme-toggle">

                        <div class="toggle-circle">
                         🌙
                        </div>

                   </div>
            </div>

            <div class="date-box" id="date-box">
                Date
            </div>

        </div>


        <!-- Profile Section -->
        <div class="profile-section">

            <div class="profile-photo">
                <img id = "profile-img" src="images/profile.jpg" alt="Profile Photo">
            </div>

            <div class="name-box">
                Hansel Shaiju Philip
            </div>

            <div class="subtitle-box">
                <span id="typing-text"></span>
                <span class="cursor">▌</span>
            </div>

        </div>


        <!-- Main Content -->
        <div class="main-content">

            <!-- Left Side -->
            <div class="left-section">

                <div class="about-box glass-card hidden">
                    <h2>About</h2>
                    <p id="about-text">
                    </p>
                </div>

                <div class="qualification-box glass-card hidden">
                    <h2>Skills</h2>
                    <p id="qualification-text"></p>
                </div>
                <div class="education-box glass-card hidden">
                    <h2>Education</h2>
                    <p id="education-text"></p>
                </div>

                <div class="contact-box glass-card hidden">

                     <h2>Contact</h2>

                         <div class="contact-links">

                            <a href="https://in.linkedin.com/in/hansel-shaiju-philip-0a1693373"
                             target="_blank">

                                 <i class="fa-brands fa-linkedin"></i>

                                    

                            </a>

                            <a href="https://github.com/Jovix-Alt"
                                target="_blank">

                                <i class="fa-brands fa-github"></i>

                                

                            </a>

                            <a href="https://instagram.com/h_an_53l"
                                target="_blank">

                                <i class="fa-brands fa-instagram"></i>

                                    

                            </a>

                            <a href="hanselphilip.valorant@gmail.com">

                                 <i class="fa-solid fa-envelope"></i>

                                    hanselphilip.valorant@gmail.com

                            </a>

                         </div>

                    </div>

            </div>


            <!-- Right Side -->
            <div class="right-section">

                <div class="predictor-box glass-card hidden">

                    <h2>Tomorrow Predictor</h2>

                    <p id="prediction-text">
                        Click the button to predict tomorrow.
                    </p>

                    <button id="predict-btn" class="glass-btn">
                        Predict Tomorrow
                    </button>

                </div>
                <div class="resource-box">

                    

                     <!-- CAD PROJECTS -->

                        <div class="resource-card glass-card hidden">

                        <h3>CAD Projects</h3>

                    <p>
                        View my mechanical and CAD designs.
                    </p>

                     <a href="https://grabcad.com/hansel.philip-2"
                     target="_blank">

                    <button class="glass-btn">

                    Open GrabCAD

                    </button>

                    </a>

                </div>


                <!-- RESUME -->

                <div class="resource-card glass-card hidden">

                    <h3>Resume</h3>

                    <p>
                        View or download my resume PDF.
                    </p>

                    <a href="resume.pdf"
                    target="_blank">

                    <button class="glass-btn">

                    Open Resume

                    </button>

                    </a>

                </div>

</div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
